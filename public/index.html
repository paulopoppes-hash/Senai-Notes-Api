<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloco de Notas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>Bloco de Notas</h1>

    <form id="formNota">
      <input type="text" id="titulo" placeholder="Título" required>
      <textarea id="texto" placeholder="Escreva sua nota..." rows="4" required></textarea>
      <button type="submit" id="btnSalvar">Salvar Nota</button>
      <button type="button" id="btnCancelar" class="cancelar" style="display:none;">Cancelar</button>
    </form>

    <div id="listaNotas"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
